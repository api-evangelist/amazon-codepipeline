      summary: Amazon CodePipeline Retry Stage Execution
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=CodePipeline 20150709.RetryStageExecution'
components:
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  schemas:
    StageNotRetryableException: {}
    ConflictException: {}
    StageNotFoundException: {}
    ValidationException: {}
    PipelineExecutionId:
      type: string
      pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    StageName:
      type: string
      pattern: '[A-Za-z0-9.@\-_]+'
      minLength: 1
      maxLength: 100
    PipelineName:
      type: string
      pattern: '[A-Za-z0-9.@\-_]+'
      minLength: 1
      maxLength: 100
    PipelineNotFoundException: {}
    NotLatestPipelineExecutionException: {}
    RetryStageExecutionOutput:
      type: object
      properties:
        pipelineExecutionId:
          allOf:
          - $ref: '#/components/schemas/PipelineExecutionId'
          - description: The ID of the current workflow execution in the failed stage.
      description: Represents the output of a <code>RetryStageExecution</code> action.
    StageRetryMode:
      type: string
      enum:
      - FAILED_ACTIONS
    RetryStageExecutionInput:
      type: object
      required:
      - pipelineName
      - stageName
      - pipelineExecutionId
      - retryMode
      title: RetryStageExecutionInput
      properties:
        pipelineName:
          allOf:
          - $ref: '#/components/schemas/PipelineName'
          - description: The name of the pipeline that contains the failed stage.
        stageName:
          allOf:
          - $ref: '#/components/schemas/StageName'
          - description: The name of the failed stage to be retried.
        pipelineExecutionId:
          allOf:
          - $ref: '#/components/schemas/PipelineExecutionId'
          - description: The ID of the pipeline execution in the failed stage to be retried. Use the <a>GetPipelineState</a> action to retrieve the current pipelineExecutionId of the failed stage
        retryMode:
          allOf:
          - $ref: '#/components/schemas/StageRetryMode'
          - description: The scope of the retry attempt. Currently, the only supported value is FAILED_ACTIONS.
      description: Represents the input of a <code>RetryStageExecution</code> action.
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
