tags:
- name: '#X Amz Target=CodePipeline 20150709.RetryStageExecution'
paths:
  /#X-Amz-Target=CodePipeline_20150709.RetryStageExecution:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: RetryStageExecution
      description: Resumes the pipeline execution by retrying the last failed actions in a stage. You can retry a stage immediately if any of the actions in the stage fail. When you retry, all actions that are still in progress continue working, and failed actions are triggered again.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryStageExecutionOutput'
              examples:
                RetryStageExecution200Example:
                  summary: Default RetryStageExecution 200 response
                  x-microcks-default: true
                  value:
                    pipelineExecutionId: '500123'
        '480':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                RetryStageExecution480Example:
                  summary: Default RetryStageExecution 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
              examples:
                RetryStageExecution481Example:
                  summary: Default RetryStageExecution 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: PipelineNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineNotFoundException'
              examples:
                RetryStageExecution482Example:
                  summary: Default RetryStageExecution 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: StageNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNotFoundException'
              examples:
                RetryStageExecution483Example:
                  summary: Default RetryStageExecution 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: StageNotRetryableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNotRetryableException'
              examples:
                RetryStageExecution484Example:
                  summary: Default RetryStageExecution 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
          description: NotLatestPipelineExecutionException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotLatestPipelineExecutionException'
              examples:
                RetryStageExecution485Example:
                  summary: Default RetryStageExecution 485 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryStageExecutionInput'
            examples:
              RetryStageExecutionRequestExample:
                summary: Default RetryStageExecution request
                x-microcks-default: true
                value:
                  pipelineName: example-resource
                  stageName: example-resource
                  pipelineExecutionId: '500123'
                  retryMode: example-value
      parameters:
      - name: X-Amz-Target
        in: header
