          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidBlockerDeclarationException'
              examples:
                CreatePipeline484Example:
                  summary: Default CreatePipeline 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
          description: InvalidStructureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidStructureException'
              examples:
                CreatePipeline485Example:
                  summary: Default CreatePipeline 485 response
                  x-microcks-default: true
                  value: example-value
        '486':
          description: LimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitExceededException'
