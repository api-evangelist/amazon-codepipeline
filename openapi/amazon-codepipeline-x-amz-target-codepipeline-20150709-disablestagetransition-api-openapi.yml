security:
- hmac: []
tags:
- name: '#X Amz Target=CodePipeline 20150709.DisableStageTransition'
paths:
  /#X-Amz-Target=CodePipeline_20150709.DisableStageTransition:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DisableStageTransition
      description: Prevents artifacts in a pipeline from transitioning to the next stage in the pipeline.
      responses:
        '200':
          description: Success
        '480':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                DisableStageTransition480Example:
                  summary: Default DisableStageTransition 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: PipelineNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineNotFoundException'
              examples:
                DisableStageTransition481Example:
                  summary: Default DisableStageTransition 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: StageNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNotFoundException'
              examples:
                DisableStageTransition482Example:
                  summary: Default DisableStageTransition 482 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableStageTransitionInput'
            examples:
              DisableStageTransitionRequestExample:
                summary: Default DisableStageTransition request
                x-microcks-default: true
                value:
                  pipelineName: example-resource
                  stageName: example-resource
                  transitionType: STANDARD
                  reason: example-value
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - CodePipeline_20150709.DisableStageTransition
      summary: Amazon CodePipeline Disable Stage Transition
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=CodePipeline 20150709.DisableStageTransition'
components:
  parameters:
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    StageTransitionType:
      type: string
      enum:
      - Inbound
      - Outbound
    DisableStageTransitionInput:
      type: object
      required:
      - pipelineName
      - stageName
      - transitionType
      - reason
      title: DisableStageTransitionInput
      properties:
        pipelineName:
          allOf:
          - $ref: '#/components/schemas/PipelineName'
          - description: The name of the pipeline in which you want to disable the flow of artifacts from one stage to another.
        stageName:
          allOf:
          - $ref: '#/components/schemas/StageName'
          - description: The name of the stage where you want to disable the inbound or outbound transition of artifacts.
        transitionType:
          allOf:
          - $ref: '#/components/schemas/StageTransitionType'
          - description: Specifies whether artifacts are prevented from transitioning into the stage and being processed by the actions in that stage (inbound), or prevented from transitioning from the stage after they have been processed by the actions in that stage (outbound).
        reason:
          allOf:
          - $ref: '#/components/schemas/DisabledReason'
          - description: The reason given to the user that a stage is disabled, such as waiting for manual approval or manual tests. This message is displayed in the pipeline console UI.
      description: Represents the input of a <code>DisableStageTransition</code> action.
    ValidationException: {}
    DisabledReason:
      type: string
      pattern: '[a-zA-Z0-9!@ \(\)\.\*\?\-]+'
      minLength: 1
      maxLength: 300
    StageName:
      type: string
      pattern: '[A-Za-z0-9.@\-_]+'
      minLength: 1
      maxLength: 100
    PipelineNotFoundException: {}
    PipelineName:
      type: string
      pattern: '[A-Za-z0-9.@\-_]+'
      minLength: 1
      maxLength: 100
    StageNotFoundException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
