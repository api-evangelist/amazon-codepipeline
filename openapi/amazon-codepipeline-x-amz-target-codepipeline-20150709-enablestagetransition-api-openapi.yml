tags:
- name: '#X Amz Target=CodePipeline 20150709.EnableStageTransition'
paths:
  /#X-Amz-Target=CodePipeline_20150709.EnableStageTransition:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: EnableStageTransition
      description: Enables artifacts in a pipeline to transition to a stage in a pipeline.
      responses:
        '200':
          description: Success
        '480':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                EnableStageTransition480Example:
                  summary: Default EnableStageTransition 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: PipelineNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineNotFoundException'
              examples:
                EnableStageTransition481Example:
                  summary: Default EnableStageTransition 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: StageNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNotFoundException'
              examples:
                EnableStageTransition482Example:
                  summary: Default EnableStageTransition 482 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableStageTransitionInput'
            examples:
              EnableStageTransitionRequestExample:
                summary: Default EnableStageTransition request
                x-microcks-default: true
                value:
                  pipelineName: example-resource
                  stageName: example-resource
                  transitionType: STANDARD
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - CodePipeline_20150709.EnableStageTransition
      summary: Amazon CodePipeline Enable Stage Transition
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=CodePipeline 20150709.EnableStageTransition'
components:
  parameters:
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    StageTransitionType:
      type: string
      enum:
      - Inbound
      - Outbound
    EnableStageTransitionInput:
      type: object
      required:
      - pipelineName
      - stageName
      - transitionType
      title: EnableStageTransitionInput
      properties:
        pipelineName:
          allOf:
          - $ref: '#/components/schemas/PipelineName'
          - description: The name of the pipeline in which you want to enable the flow of artifacts from one stage to another.
        stageName:
          allOf:
          - $ref: '#/components/schemas/StageName'
          - description: The name of the stage where you want to enable the transition of artifacts, either into the stage (inbound) or from that stage to the next stage (outbound).
        transitionType:
          allOf:
          - $ref: '#/components/schemas/StageTransitionType'
          - description: Specifies whether artifacts are allowed to enter the stage and be processed by the actions in that stage (inbound) or whether already processed artifacts are allowed to transition to the next stage (outbound).
      description: Represents the input of an <code>EnableStageTransition</code> action.
    ValidationException: {}
    StageName:
      type: string
      pattern: '[A-Za-z0-9.@\-_]+'
      minLength: 1
      maxLength: 100
    PipelineNotFoundException: {}
    PipelineName:
      type: string
      pattern: '[A-Za-z0-9.@\-_]+'
      minLength: 1
      maxLength: 100
    StageNotFoundException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
