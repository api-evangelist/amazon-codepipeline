paths:
  /#X-Amz-Target=CodePipeline_20150709.ListActionExecutions:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListActionExecutions
      description: Lists the action executions that have occurred in a pipeline.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListActionExecutionsOutput'
              examples:
                ListActionExecutions200Example:
                  summary: Default ListActionExecutions 200 response
                  x-microcks-default: true
                  value:
                    actionExecutionDetails: example-value
                    nextToken: example-value
        '480':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                ListActionExecutions480Example:
                  summary: Default ListActionExecutions 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: PipelineNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineNotFoundException'
              examples:
                ListActionExecutions481Example:
                  summary: Default ListActionExecutions 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InvalidNextTokenException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidNextTokenException'
              examples:
                ListActionExecutions482Example:
                  summary: Default ListActionExecutions 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: PipelineExecutionNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineExecutionNotFoundException'
              examples:
                ListActionExecutions483Example:
                  summary: Default ListActionExecutions 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListActionExecutionsInput'
            examples:
              ListActionExecutionsRequestExample:
                summary: Default ListActionExecutions request
                x-microcks-default: true
                value:
                  pipelineName: example-resource
                  filter: example-value
                  maxResults: example-value
                  nextToken: example-value
      parameters:
      - name: maxResults
        in: query
