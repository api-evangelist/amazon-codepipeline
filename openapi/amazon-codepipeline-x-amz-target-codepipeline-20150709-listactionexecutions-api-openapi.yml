          type: string
        description: Pagination token
        required: false
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - CodePipeline_20150709.ListActionExecutions
      summary: Amazon CodePipeline List Action Executions
