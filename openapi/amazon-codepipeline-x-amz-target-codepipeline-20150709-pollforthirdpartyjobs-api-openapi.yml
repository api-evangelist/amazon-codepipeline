paths:
  /#X-Amz-Target=CodePipeline_20150709.PollForThirdPartyJobs:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: PollForThirdPartyJobs
      description: 'Determines whether there are any third party jobs for a job worker to act on. Used for partner actions only.


        When this API is called, CodePipeline returns temporary credentials for the S3 bucket used to store artifacts for the pipeline, if the action requires access to that S3 bucket for input or output artifacts.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollForThirdPartyJobsOutput'
              examples:
                PollForThirdPartyJobs200Example:
                  summary: Default PollForThirdPartyJobs 200 response
                  x-microcks-default: true
                  value:
                    jobs: example-value
        '480':
          description: ActionTypeNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTypeNotFoundException'
              examples:
                PollForThirdPartyJobs480Example:
                  summary: Default PollForThirdPartyJobs 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                PollForThirdPartyJobs481Example:
                  summary: Default PollForThirdPartyJobs 481 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollForThirdPartyJobsInput'
            examples:
              PollForThirdPartyJobsRequestExample:
                summary: Default PollForThirdPartyJobs request
                x-microcks-default: true
                value:
                  actionTypeId: '500123'
                  maxBatchSize: example-value
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - CodePipeline_20150709.PollForThirdPartyJobs
      summary: Amazon CodePipeline Poll for Third Party Jobs
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=CodePipeline 20150709.PollForThirdPartyJobs'
