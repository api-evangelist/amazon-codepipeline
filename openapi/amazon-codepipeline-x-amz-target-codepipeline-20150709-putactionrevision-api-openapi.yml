    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: PutActionRevision
      description: Provides information to CodePipeline about new revisions to a source.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutActionRevisionOutput'
              examples:
                PutActionRevision200Example:
                  summary: Default PutActionRevision 200 response
                  x-microcks-default: true
                  value:
                    newRevision: example-value
                    pipelineExecutionId: '500123'
        '480':
          description: PipelineNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineNotFoundException'
              examples:
                PutActionRevision480Example:
                  summary: Default PutActionRevision 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: StageNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageNotFoundException'
              examples:
                PutActionRevision481Example:
                  summary: Default PutActionRevision 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: ActionNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionNotFoundException'
              examples:
                PutActionRevision482Example:
                  summary: Default PutActionRevision 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                PutActionRevision483Example:
                  summary: Default PutActionRevision 483 response
                  x-microcks-default: true
                  value: example-value
