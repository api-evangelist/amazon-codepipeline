            examples:
              PutActionRevisionRequestExample:
                summary: Default PutActionRevision request
                x-microcks-default: true
                value:
                  pipelineName: example-resource
                  stageName: example-resource
                  actionName: example-resource
                  actionRevision: example-value
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
