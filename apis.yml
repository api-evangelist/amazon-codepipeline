- type: Features
  data:
  - name: Pipeline Automation
    description: Automate the entire release process from source code to production with customizable
      pipeline stages and actions.
  - name: Parallel Execution
    description: Run multiple actions in parallel within a pipeline stage to speed up your delivery workflows.
  - name: Manual Approval Actions
    description: Add manual approval gates to pipelines for human review before promoting changes to production
      environments.
  - name: Pipeline Conditions
    description: Define conditions that must be met for a pipeline to proceed, including CloudWatch alarms
      and custom conditions.
  - name: Cross-Account Deployments
    description: Deploy to multiple AWS accounts and regions from a single pipeline using cross-account
      roles and artifact stores.
  - name: Custom Actions
    description: Create custom pipeline actions using Lambda functions or CodeBuild projects for specialized
      workflow steps.
  - name: Execution History
    description: Track the full execution history of each pipeline run including status, timing, and artifact
      details for each action.
- type: UseCases
  data:
  - name: Continuous Delivery Pipeline
    description: Automate the entire software delivery lifecycle from source commit through build, test,
      staging, and production deployment.
  - name: Multi-Environment Promotion
    description: Automatically promote changes through development, staging, and production environments
      with approval gates between stages.
  - name: Infrastructure as Code Deployment
    description: Deploy CloudFormation stacks and Terraform configurations as pipeline stages for automated
      infrastructure provisioning.
  - name: Microservices Delivery
    description: Orchestrate independent delivery pipelines for multiple microservices, each triggered
      by its own source repository.
  - name: Blue/Green Deployments
    description: Use CodeDeploy actions in pipelines to implement zero-downtime blue/green deployments
      automatically.
- type: Integrations
  data:
  - name: AWS CodeBuild
    description: Use CodeBuild as the build and test stage in pipelines.
  - name: AWS CodeDeploy
    description: Use CodeDeploy as the deployment stage for EC2, Lambda, and ECS targets.
  - name: AWS CodeCommit
    description: Trigger pipelines automatically on CodeCommit repository changes.
  - name: GitHub
    description: Connect GitHub repositories as pipeline source stages with webhook triggers.
  - name: Amazon S3
    description: Use S3 as a source stage or for storing pipeline artifacts between stages.
  - name: AWS CloudFormation
    description: Deploy infrastructure as code using CloudFormation actions in pipeline stages.
  - name: AWS Elastic Beanstalk
    description: Deploy application updates to Elastic Beanstalk environments from pipelines.
  - name: Amazon ECS
    description: Deploy container updates to ECS services as a pipeline deployment stage.
  - name: Amazon EventBridge
    description: Trigger pipelines from EventBridge events for event-driven delivery workflows.
